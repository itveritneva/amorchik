name: supabase-keepalive
# Бесплатный Supabase засыпает после 7 дней без запросов. Пингуем базу каждые 3 дня.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "https://vbbzxqdjhdgtiagdoumx.supabase.co/rest/v1/amorchik_waitlist?select=id&limit=1" \
            -H "apikey: sb_publishable_sIOVQ5cV5zEMLcAa2tmqSA_F3pvKyfy"
